<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
    <title>Yugen Store - Administrar Producto</title>
</head>

<body class="wrapper">
    <div th:replace="~{layout :: header}"></div>

    <main class="container content my-5" style="margin-top: 100px !important;">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0 p-4">
                    <h2 class="mb-4 fw-bold text-center"><i class="bi bi-pencil-square me-2"></i>Gestión de Producto
                    </h2>
                    <hr>

                    <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post"
                        enctype="multipart/form-data">
                        <input type="hidden" th:field="*{idProducto}" />

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del Producto</label>
                            <input type="text" th:field="*{nombre}" class="form-control"
                                placeholder="Ej: Manga Naruto Vol. 1" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control" rows="3"
                                placeholder="Detalles del producto..."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Precio</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Stock Inicial</label>
                                <input type="number" th:field="*{stock}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Categoría</label>
                            <select th:field="*{categoria}" class="form-select" required>
                                <option value="">Seleccione una categoría</option>
                                <option value="Manga">Manga</option>
                                <option value="Figuras">Figuras</option>
                                <option value="Accesorios">Accesorios</option>
                                <option value="Peluches">Peluches</option>
                                <option value="Indumentaria">Indumentaria</option>
                                <option value="Escolar">Escolar</option>
                                <option value="Multimedia">CD,DVD & Blu-rays</option>
                                <option value="Otros">Otros</option>
                                <option value="Ofertas">Ofertas</option>

                            </select>
                        </div>

                        <div class="card bg-light p-3 mb-4">
                            <h6 class="fw-bold mb-3">Multimedia</h6>
                            <div class="mb-3">
                                <label class="form-label small">Subir archivo de imagen</label>
                                <input type="file" name="imgFile" class="form-control" accept="image/*">
                            </div>
                            <div class="mb-0">
                                <label class="form-label small">O pegar URL de imagen existente</label>
                                <input type="text" th:field="*{urlImg}" class="form-control" placeholder="https://...">
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4 fw-bold">GUARDAR PRODUCTO</button>
                            <a th:href="@{/admin/productos}" class="btn btn-outline-secondary px-4">CANCELAR</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: js-scripts}"></div>
</body>

</html>
