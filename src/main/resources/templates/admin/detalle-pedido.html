<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="wrapper bg-light">
    <div th:replace="~{layout :: header}"></div>

    <main class="container content my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="bi bi- receipt-cutoff me-2"></i> Gestión de Orden #[[${pedido.idPedido}]]</h2>
            <a th:href="@{/admin/dashboard}" class="btn btn-dark btn-sm rounded-pill px-3">Volver al Panel</a>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white fw-bold">Información del Cliente</div>
                    <div class="card-body">
                        <p class="mb-1"><i class="bi bi-person me-2"></i><strong th:text="${pedido.usuario.nombre}"></strong></p>
                        <p class="text-muted small"><i class="bi bi-envelope me-2"></i>[[${pedido.usuario.email}]]</p>
                        <hr>
                        <div class="d-grid">
                            <button class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-cloud-arrow-up me-2"></i>Sincronizar con Salesforce
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <table class="table align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Producto</th>
                                    <th>Precio</th>
                                    <th>Cant.</th>
                                    <th class="text-end pe-4">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="det : ${pedido.detallesPedido}">
                                    <td class="ps-4">
                                        <div class="d-flex align-items-center">
                                            <img th:src="${det.producto.urlImg}" class="rounded me-2" style="width: 40px; height: 40px; object-fit: cover;">
                                            <span th:text="${det.producto.nombre}"></span>
                                        </div>
                                    </td>
                                    <td th:text="'$' + ${det.precioUnitario}"></td>
                                    <td th:text="${det.cantidad}"></td>
                                    <td class="text-end pe-4 fw-bold" th:text="'$' + ${det.subTotal}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer bg-white text-end py-3 pe-4">
                        <span class="text-muted me-2">Total del Pedido:</span>
                        <span class="fs-4 fw-bold text-primary" th:text="'$' + ${pedido.total}"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: js-scripts}"></div>
</body>
</html>
