<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yugen Store - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body class="wrapper">
  <div th:replace="~{/template_admin :: header}"></div>

  <div class="container content">

    <header class="jumbotron my-4 text-center">
      <h1 class="display-3 fw-bold">Bienvenidos a Yugen Store</h1>
      <p class="lead">Tu tienda favorita de productos exclusivos</p>
    </header>

    <div id="carouselExampleIndicators" class="carousel slide shadow mb-5" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
      </div>
      <div class="carousel-inner rounded shadow-sm">
        <div class="carousel-item active">
          <img src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=1200&h=400&auto=format&fit=crop"
            class="d-block w-100" alt="Banner 1" style="max-height: 400px; object-fit: cover;">
        </div>
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1200&h=400&auto=format&fit=crop"
            class="d-block w-100" alt="Banner 2" style="max-height: 400px; object-fit: cover;">
        </div>
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?q=80&w=1200&h=400&auto=format&fit=crop"
            class="d-block w-100" alt="Banner 3" style="max-height: 400px; object-fit: cover;">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
        data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
        data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
      </button>
    </div>

    <div class="container my-5">
      <h2 class="text-center mb-4 fw-bold">Nuestras Categorías</h2>
      <div class="row g-4">

        <div class="col-lg-4 col-md-6">
          <a th:href="@{/productos/buscar(categoria='Manga')}" class="category-item">
            <div class="category-img-container">
              <img th:src="@{/img/cat-manga.jpg}" alt="Manga">
              <div class="category-overlay"><span>MANGA</span></div>
            </div>
          </a>
        </div>

        <div class="col-lg-4 col-md-6">
          <a href="#" class="category-item">
            <div class="category-img-container">
              <img th:src="@{/img/cat-figuras.jpg}" alt="Figuras">
              <div class="category-overlay"><span>FIGURAS</span></div>
            </div>
          </a>
        </div>

        <div class="col-lg-4 col-md-6">
          <a href="#" class="category-item">
            <div class="category-img-container">
              <img th:src="@{/img/cat-accesorios.jpg}" alt="Accesorios">
              <div class="category-overlay"><span>ACCESORIOS</span></div>
            </div>
          </a>
        </div>

        <div class="col-lg-4 col-md-6">
          <a href="#" class="category-item">
            <div class="category-img-container">
              <img th:src="@{/img/cat-peluches.jpg}" alt="Peluches">
              <div class="category-overlay"><span>PELUCHES</span></div>
            </div>
          </a>
        </div>

        <div class="col-lg-4 col-md-6">
          <a href="#" class="category-item">
            <div class="category-img-container">
              <img th:src="@{/img/cat-indumentaria.jpg}" alt="indumentaria">
              <div class="category-overlay"><span>INDUMENTARIA</span></div>
            </div>
          </a>
        </div>

        <div class="col-lg-4 col-md-6">
          <a href="#" class="category-item">
            <div class="category-img-container">
              <img th:src="@{/img/cat-escolar.jpg}" alt="escolar">
              <div class="category-overlay"><span>ESCOLAR</span></div>
            </div>
          </a>
        </div>

        <div class="col-lg-4 col-md-6">
          <a href="#" class="category-item">
            <div class="category-img-container">
              <img th:src="@{/img/cat-otros.jpg}" alt="otros">
              <div class="category-overlay"><span>CD, DVD & BLU-RAYS</span></div>
            </div>
          </a>
        </div>

        <div class="col-lg-4 col-md-6">
          <a href="#" class="category-item">
            <div class="category-img-container">
              <img th:src="@{/img/cat-figuras.jpg}" alt="Otros">
              <div class="category-overlay"><span>OTROS</span></div>
            </div>
          </a>
        </div>

        <div class="col-lg-4 col-md-6">
          <a href="#" class="category-item">
            <div class="category-img-container">
              <img th:src="@{/img/cat-manga-jp.jpg}" alt="Ofertas">
              <div class="category-overlay"><span>OFERTAS</span></div>
            </div>
          </a>
        </div>

      </div>

    </div>

  </div>
  </div>
  </div>
  <div th:replace="~{template_admin :: footer}"></div>
</body>

</html>
