<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Yugen Store - Crear Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body>
    <div th:replace="~{template_admin :: header}"></div>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <h2 class="mb-4 text-center">Crear Nuevo Producto</h2>

                    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post"
                        enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">Nombre del Producto</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Precio</label>
                                <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock</label>
                                <input type="number" th:field="*{stock}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <select th:field="*{categoria}" class="form-select" required>
                                <option value="">Seleccione una categoría</option>
                                <option value="Manga">Manga</option>
                                <option value="Figuras">Figuras</option>
                                <option value="Accesorios">Accesorios</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Subir Imagen (Archivo)</label>
                            <input type="file" name="imgFile" class="form-control" accept="image/*">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">O URL de la Imagen</label>
                            <input type="text" th:field="*{urlImg}" class="form-control" placeholder="https://...">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Guardar Producto</button>
                            <a th:href="@{/productos/catalogo}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{template_admin :: footer}"></div>
</body>

</html>
