<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Yugen Store - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{/template_admin :: header}"></div>

    <main class="container mt-5 pt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="my-4 fw-bold">Catálogo de Productos</h1>
        </div>

        <div class="row">
            <div class="col-md-4 mb-4" th:each="p : ${productos}">
                <div class="card h-100 shadow-sm border-0">
                    <div class="position-relative">
                        <img th:src="${p.urlImg}" class="card-img-top" alt="Imagen del producto"
                            style="height: 250px; object-fit: cover;">
                        <span class="position-absolute top-0 end-0 m-2 badge bg-primary"
                            th:text="${p.categoria}">Categoría</span>
                    </div>

                    <div class="card-body">
                        <h5 class="card-title fw-bold" th:text="${p.nombre}">Nombre</h5>
                        <p class="card-text text-muted small" th:text="${p.descripcion}">Descripción...</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fs-5 fw-bold text-primary" th:text="'$' + ${p.precio}">$0.00</span>
                            <span class="text-muted small">Stock: <span th:text="${p.stock}">0</span></span>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-top-0 pb-3">
                        <form th:action="@{/carrito/agregar}" method="post">
                            <input type="hidden" name="id" th:value="${p.idProducto}" />

                            <input type="hidden" name="cantidad" value="1" />

                            <button type="submit"
                                class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-cart-plus"></i> Añadir al carrito
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${productos == null or productos.isEmpty()}" class="alert alert-light text-center shadow-sm">
            <i class="bi bi-emoji-frown fs-1"></i>
            <p class="mt-2">No encontramos productos en esta sección.</p>
            <a th:href="@{/home}" class="btn btn-link">Volver al inicio</a>
        </div>
    </main>

    <div th:replace="~{/template_admin :: footer}"></div>
</body>

</html>
