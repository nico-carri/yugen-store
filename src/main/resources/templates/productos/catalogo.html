<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
    <title>Yugen Store - Catálogo</title>
</head>

<body class="wrapper">
    <div th:replace="~{layout :: header}"></div>

    <main class="container content my-5" style="margin-top: 100px !important;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold" th:text="${tituloPagina}">Catálogo de Productos</h1>
        </div>

        <div th:if="${mensajeNoResultados}" class="alert alert-warning shadow-sm" th:text="${mensajeNoResultados}">
        </div>

        <div class="row g-4">
            <div class="col-lg-3 col-md-4 col-sm-6" th:each="p : ${productos}">
                <div class="card h-100 shadow-sm border-0 product-card">
                    <div class="position-relative overflow-hidden">
                        <img th:src="${p.urlImg}" class="card-img-top img-hover" alt="Imagen del producto"
                            style="height: 280px; object-fit: cover;">
                        <span class="position-absolute top-0 end-0 m-2 badge bg-dark opacity-75"
                            th:text="${p.categoria}">Categoría</span>
                    </div>

                    <div class="card-body d-flex flex-column">
                        <h6 class="card-title fw-bold mb-1" th:text="${p.nombre}">Nombre</h6>
                        <p class="card-text text-muted small flex-grow-1" th:text="${p.descripcion}">Descripción
                            corta...</p>

                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="fs-5 fw-bold text-primary" th:text="'$' + ${p.precio}">$0.00</span>
                            <span class="badge text-dark bg-light border">Stock: [[${p.stock}]]</span>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-top-0 pb-3">
                        <form onsubmit="event.preventDefault(); if(verificarAcceso(event)) agregarAsync(this);">
                            <input type="hidden" name="id" th:value="${p.idProducto}">
                            <input type="hidden" name="cantidad" value="1">
                            <button type="submit" class="btn btn-dark w-100 fw-bold">
                                <i class="bi bi-cart-plus me-2"></i>AÑADIR
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${productos == null or productos.isEmpty()}" class="text-center py-5">
            <i class="bi bi-search text-muted" style="font-size: 4rem;"></i>
            <h3 class="mt-3 text-muted">No encontramos lo que buscas</h3>
            <p>Intentá con otra categoría o palabra clave.</p>
            <a th:href="@{/productos/catalogo}" class="btn btn-outline-primary rounded-pill px-4">Ver todo el
                catálogo</a>
        </div>
    </main>

    

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: js-scripts}"></div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/carrito.js}"></script>

    <script th:inline="javascript">
        function manejarAgregar(form) {
                const userMark = document.querySelector('.navbar');
                agregarAsync(form, loggedIn); 
        }
    </script>



</body>

</html>
