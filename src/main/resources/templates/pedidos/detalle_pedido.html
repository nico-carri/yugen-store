<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Resumen de Compra - Yugen Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body class="bg-light">
    <div th:replace="~{template_admin :: header}"></div>

    <div class="container mt-5 pt-5">
        <div class="card shadow border-0 mt-4">
            <div class="card-header bg-success text-white py-3">
                <h3 class="mb-0">¡Gracias por tu compra!</h3>
            </div>
            <div class="card-body p-4">
                <div class="d-flex justify-content-between">
                    <h5>Número de Pedido: #<span th:text="${pedido.idPedido}"></span></h5>
                    <p class="text-muted">Fecha: <span
                            th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}"></span></p>
                </div>
                <hr>
                <table class="table table-hover mt-3">
                    <thead class="table-light">
                        <tr>
                            <th>Producto</th>
                            <th class="text-center">Cantidad</th>
                            <th class="text-end">Precio Unit.</th>
                            <th class="text-end">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="det : ${pedido.detallesPedido}">
                            <td th:text="${det.producto.nombre}"></td>
                            <td class="text-center" th:text="${det.cantidad}"></td>
                            <td class="text-end" th:text="'$' + ${det.precioUnitario}"></td>
                            <td class="text-end fw-bold" th:text="'$' + ${det.subTotal}"></td>
                        </tr>
                    </tbody>
                </table>
                <h4 class="text-end mt-4">Total Pagado: <span class="text-success"
                        th:text="'$' + ${pedido.total}"></span></h4>
            </div>
            <div class="card-footer bg-white p-3 d-flex justify-content-between">
                <a th:href="@{/home}" class="btn btn-outline-secondary">Volver al Inicio</a>
                <button onclick="window.print()" class="btn btn-primary">
                    <i class="bi bi-printer"></i> Imprimir Ticket
                </button>
            </div>
        </div>
    </div>

    <div th:replace="~{template_admin :: footer}"></div>
</body>

</html>
