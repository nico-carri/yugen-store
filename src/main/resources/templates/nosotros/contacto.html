<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
    <title>Contacto - Yugen Store</title>
</head>

<body class="wrapper bg-light">
    <div th:replace="~{layout :: header}"></div>

    <main class="container content my-5 d-flex align-items-center" style="margin-top: 100px !important;">
        <div class="row w-100 justify-content-center">
            <div class="col-lg-10">
                <div class="card border-0 shadow-lg overflow-hidden">
                    <div class="row g-0">
                        <div class="col-md-5 bg-dark text-white p-5 d-flex flex-column justify-content-center">
                            <h2 class="fw-bold mb-4">Contactanos</h2>
                            <p class="opacity-75 mb-5">¿Tenés dudas sobre un producto o tu pedido? Estamos para
                                ayudarte.</p>

                            <div class="d-flex align-items-center mb-3">
                                <i class="bi bi-geo-alt-fill me-3 fs-4 text-primary"></i>
                                <span>Buenos Aires, Argentina</span>
                            </div>
                            <div class="d-flex align-items-center mb-3">
                                <i class="bi bi-envelope-fill me-3 fs-4 text-primary"></i>
                                <span>soporte@yugenstore.com</span>
                            </div>
                            <div class="d-flex align-items-center">
                                <i class="bi bi-whatsapp me-3 fs-4 text-primary"></i>
                                <span>+54 11 1234-5678</span>
                            </div>
                        </div>
                        <div class="col-md-7 p-5 bg-white">
                            <form id="contactForm">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Nombre Completo</label>
                                    <input type="text" class="form-control bg-light border-0" required
                                        placeholder="Tu nombre">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Correo Electrónico</label>
                                    <input type="email" class="form-control bg-light border-0" required
                                        placeholder="tu@email.com">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Mensaje</label>
                                    <textarea class="form-control bg-light border-0" rows="4" required
                                        placeholder="¿En qué podemos ayudarte?"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3">
                                    ENVIAR MENSAJE <i class="bi bi-send ms-2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: js-scripts}"></div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function (e) {
            e.preventDefault();
            Swal.fire({
                title: '¡Mensaje Enviado!',
                text: 'Te responderemos al correo ingresado en menos de 24hs.',
                icon: 'success',
                confirmButtonColor: '#0d6efd',
                confirmButtonText: 'Excelente'
            }).then(() => {
                window.location.href = '/';
            });
        });
    </script>
</body>

</html>
