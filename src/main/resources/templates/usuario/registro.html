<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Yugen Store - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body class="wrapper">
    <div th:replace="~{template_admin :: header}"></div>

    <div class="container content d-flex justify-content-center align-items-center my-5">
        <div class="card shadow border-0" style="max-width: 500px; width: 100%;">
            <div class="card-body p-5">
                <h2 class="text-center fw-bold mb-4">Crear Cuenta</h2>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

                <form th:action="@{/usuario/registro}" th:object="${usuario}" method="post">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control" placeholder="Tu nombre"
                                required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Apellido</label>
                            <input type="text" th:field="*{apellido}" class="form-control" placeholder="Tu apellido"
                                required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="ejemplo@correo.com"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" th:field="*{password}" class="form-control"
                            placeholder="Mínimo 6 caracteres" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Confirmar Contraseña</label>
                        <input type="password" th:field="*{confirmarPassword}" class="form-control"
                            placeholder="Repite tu contraseña" required>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 fw-bold py-2">REGISTRARME</button>
                </form>

                <div class="text-center mt-4">
                    <span>¿Ya tienes cuenta?
                        <a th:href="@{/usuario/login}" class="text-decoration-none fw-bold text-primary">Inicia
                            sesión</a>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{template_admin :: footer}"></div>
</body>

</html>
