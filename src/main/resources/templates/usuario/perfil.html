<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - Yugen Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body class="wrapper">
    <div th:replace="~{template_admin :: header}"></div>

    <div class="container content my-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-4 text-center">
                    <div class="mb-3">
                        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" width="100"
                            alt="Foto perfil">
                    </div>
                    <h4 class="fw-bold" th:text="${usuario.nombre} + ' ' + ${usuario.apellido}">Nombre de Usuario</h4>
                    <p class="text-muted" th:text="${usuario.email}">email@ejemplo.com</p>

                    <span class="badge bg-secondary mb-3" th:text="${usuario.role}">ROL</span>
                    <hr>
                    <a href="#" class="btn btn-outline-dark btn-sm">Editar mis datos</a>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card border-0 shadow-sm p-4">
                    <h3 class="fw-bold mb-4">Mi Actividad</h3>

                    <div th:if="${usuario.role.name() == 'CLIENTE'}">
                        <h5>Mis Pedidos Recientes</h5>
                        <table class="table mt-3">
                            <thead>
                                <tr>
                                    <th>Orden #</th>
                                    <th>Fecha</th>
                                    <th>Estado</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="4" class="text-center text-muted">Aún no has realizado pedidos.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div th:if="${usuario.role.name() == 'ADMIN'}">
                        <h5>Panel de Control Rápido</h5>
                        <div class="list-group mt-3">
                            <a th:href="@{/productos/nuevo}"
                                class="list-group-item list-group-item-action fw-bold text-primary">
                                ➕ Cargar nuevo producto
                            </a>
                            <a href="#" class="list-group-item list-group-item-action">Ver todas las ventas</a>
                            <a href="#" class="list-group-item list-group-item-action">Gestionar Usuarios</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{template_admin :: footer}"></div>
</body>

</html>
