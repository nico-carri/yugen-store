<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Yugen Store - Mi Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{/template_admin :: header}"></div>

    <main class="container mt-5 pt-5 content">
        <h2 class="fw-bold mb-4"><i class="bi bi-cart-fill me-2"></i>Tu Carrito de Compras</h2>

        <div th:if="${items == null || items.empty}" class="alert alert-white text-center shadow-sm py-5 border-0">
            <i class="bi bi-cart-x display-1 text-muted"></i>
            <p class="lead mt-3">No hay productos en el carrito actualmente.</p>
            <a th:href="@{/productos/catalogo}" class="btn btn-primary px-4 py-2">IR A LA TIENDA</a>
        </div>

        <div th:if="${items != null && !items.empty}" class="row g-4">

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm overflow-hidden">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-3">Producto</th>
                                    <th>Precio</th>
                                    <th class="text-center">Cantidad</th>
                                    <th>Subtotal</th>
                                    <th class="text-center">Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${items}">
                                    <td class="ps-3 py-3">
                                        <div class="d-flex align-items-center">
                                            <img th:src="${item.urlImg}" class="rounded me-3 shadow-sm" width="60"
                                                height="60" style="object-fit: cover;">
                                            <div>
                                                <span class="fw-bold d-block" th:text="${item.nombre}"></span>
                                            </div>
                                        </div>
                                    </td>
                                    <td th:text="'$' + ${item.precio}"></td>
                                    <td style="width: 140px;">
                                        <div class="input-group input-group-sm justify-content-center">
                                            <a th:href="@{/carrito/restar/{id}(id=${item.idProducto})}"
                                                class="btn btn-outline-secondary fw-bold shadow-none">-</a>

                                            <span class="input-group-text bg-white px-3 fw-bold"
                                                th:text="${item.cantidadDeseada}">1</span>

                                            <a th:href="@{/carrito/sumar/{id}(id=${item.idProducto})}"
                                                class="btn btn-outline-secondary fw-bold shadow-none">+</a>
                                        </div>
                                    </td>
                                    <td class="fw-bold text-primary" th:text="'$' + ${item.getSubTotal()}"></td>
                                    <td class="text-center">
                                        <a th:href="@{/carrito/eliminar/{id}(id=${item.idProducto})}"
                                            class="btn btn-sm text-danger border-0"
                                            onclick="return confirm('¿Quitar este producto del carrito?')">
                                            <i class="bi bi-trash3-fill fs-5"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm p-4 position-sticky" style="top: 100px;">
                    <h4 class="fw-bold border-bottom pb-3">Resumen del Pedido</h4>

                    <div class="d-flex justify-content-between mb-3 mt-2 text-muted">
                        <span>Productos seleccionados:</span>
                        <span th:text="${items.size()}">0</span>
                    </div>

                    <div class="d-flex justify-content-between mb-4 h4">
                        <span class="fw-bold">Total:</span>
                        <span class="fw-bold text-primary" th:text="'$' + ${total}">$0.00</span>
                    </div>

                    <div class="d-grid gap-3">
                        <a th:href="@{/pedidos/finalizar}" class="btn btn-success btn-lg fw-bold py-3 shadow-sm">
                            FINALIZAR COMPRA
                        </a>
                        <a th:href="@{/productos/catalogo}" class="btn btn-outline-dark">
                            <i class="bi bi-arrow-left me-2"></i>Seguir comprando
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{/template_admin :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
