<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
    <title>Mi Carrito - Yugen Store</title>
</head>

<body class="wrapper bg-light">
    <div th:replace="~{layout :: header}"></div>

    <main class="container content my-5" style="margin-top: 100px !important;">
        <h2 class="fw-bold mb-4">
            Tu Carrito
            <span class="text-muted fw-light small">
                (<span id="total-unidades-texto" th:text="${totalUnidades}">0</span>
                <span id="etiqueta-productos"
                    th:text="${totalUnidades == 1 ? 'producto' : 'productos'}">productos</span>)
            </span>
        </h2>

        <div th:if="${items == null || items.empty}" class="card border-0 shadow-sm py-5 text-center">
            <div class="card-body">
                <i class="bi bi-cart-x display-1 text-muted"></i>
                <p class="lead mt-3">Tu carrito está vacío.</p>
                <a th:href="@{/productos/catalogo}" class="btn btn-primary rounded-pill px-4">EMPEZAR A COMPRAR</a>
            </div>
        </div>

        <div th:if="${items != null && !items.empty}" class="row g-4">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm overflow-hidden rounded-4">
                    <table class="table align-middle mb-0">
                        <thead class="bg-dark text-white">
                            <tr>
                                <th class="ps-4 py-3">Producto</th>
                                <th class="py-3">Precio</th>
                                <th class="py-3 text-center">Cantidad</th>
                                <th class="py-3">Subtotal</th>
                                <th class="text-center pe-4">Quitar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${items}">
                                <td class="ps-4 py-4">
                                    <div class="d-flex align-items-center">
                                        <img th:src="${item.urlImg}" class="rounded-3 shadow-sm me-3" width="70"
                                            height="90" style="object-fit: cover;">
                                        <span class="fw-bold" th:text="${item.nombre}"></span>
                                    </div>
                                </td>
                                <td th:text="'$' + ${item.precio}"></td>
                                <td style="min-width: 130px;">
                                    <div class="input-group input-group-sm justify-content-center">
                                        <a th:href="@{/carrito/restar/{id}(id=${item.idProducto})}"
                                            class="btn btn-light border px-2">-</a>
                                        <span class="input-group-text bg-white px-3 fw-bold"
                                            th:text="${item.cantidadDeseada}">1</span>
                                        <a th:href="@{/carrito/sumar/{id}(id=${item.idProducto})}"
                                            class="btn btn-sm btn-outline-secondary border">
                                            <i class="bi bi-plus"></i>
                                        </a>
                                    </div>
                                </td>
                                <td class="fw-bold text-primary" th:text="'$' + ${item.getSubTotal()}"></td>
                                <td class="text-center pe-4">
                                    <a th:href="@{/carrito/eliminar/{id}(id=${item.idProducto})}"
                                        class="btn btn-sm btn-outline-danger border-0">
                                        <i class="bi bi-trash3"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm p-4 rounded-4 position-sticky" style="top: 100px;">
                    <h5 class="fw-bold mb-4">Resumen de compra</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal</span>
                        <span th:text="'$' + ${total}"></span>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="text-muted">Envío</span>
                        <span class="text-success fw-bold">Gratis</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4 align-items-center">
                        <span class="fw-bold fs-5">Total</span>
                        <span class="fw-bold fs-4 text-primary" th:text="'$' + ${total}"></span>
                    </div>
                    <div class="d-grid gap-2">
                        <a th:href="@{/pedidos/finalizar}"
                            class="btn btn-success btn-lg py-3 fw-bold rounded-pill shadow-sm">FINALIZAR COMPRA</a>
                        <a th:href="@{/productos/catalogo}" class="btn btn-link text-decoration-none text-muted">Seguir
                            comprando</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: js-scripts}"></div>
</body>

</html>
