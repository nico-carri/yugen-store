<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Gestión de Inventario - Yugen Store</title>
</head>
<body class="wrapper">
    <div th:replace="~{layout :: header}"></div>

    <main class="container content my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Gestión de Productos</h2>
            <a th:href="@{/admin/productos/nuevo}" class="btn btn-dark">
                <i class="bi bi-plus-circle me-1"></i> Nuevo Producto
            </a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Imagen</th>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="prod : ${productos}">
                                <td class="ps-4">
                                    <img th:src="${prod.urlImg}" class="rounded" style="width: 50px; height: 50px; object-fit: cover;">
                                </td>
                                <td th:text="${prod.nombre}" class="fw-bold"></td>
                                <td th:text="${prod.categoria}"></td>
                                <td th:text="'$' + ${prod.precio}" class="text-primary"></td>
                                <td>
                                    <span th:text="${prod.stock}" 
                                        th:class="${prod.stock < 5} ? 'badge bg-danger' : 'badge bg-secondary'">
                                    </span>
                                </td>
                                <td class="text-end pe-4">
                                    <div class="btn-group shadow-sm">
                                        <a th:href="@{/admin/productos/editar/{id}(id=${prod.idProducto})}" class="btn btn-sm btn-outline-dark">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/admin/productos/eliminar/{id}(id=${prod.idProducto})}" 
                                        class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('¿Seguro que deseas eliminar este producto?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: js-scripts}"></div>
</body>
</html>
