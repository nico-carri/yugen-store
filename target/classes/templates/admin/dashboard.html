<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Panel de Administración - Yugen</title>
</head>
<body class="wrapper">
    <div th:replace="~{layout :: header}"></div>

    <main class="container my-5 content">
    <div class="row">
        <div class="col-md-12">
            <div class="card bg-dark text-white shadow mb-4">
                <div class="card-body p-5">
                    <h1 class="display-4 fw-bold">Modo Administrador</h1>
                    <p class="lead" th:text="${mensaje}"></p>
                    <hr class="my-4 bg-light">
                    <div class="d-flex gap-3">
                        <a th:href="@{/admin/productos}" class="btn btn-outline-light btn-lg">Gestionar Productos</a>
                        <a th:href="@{/admin/graficos}" class="btn btn-light btn-lg">Ver gráficos</a>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold mb-0">Últimos Pedidos</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Orden #</th>
                                    <th>Cliente</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                    <th class="text-end pe-4">Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${ultimosPedidos}">
                                    <td class="ps-4 fw-bold" th:text="'#' + ${p.idPedido}"></td>
                                    <td th:text="${p.usuario.nombre} + ' ' + ${p.usuario.apellido}"></td>
                                    <td th:text="'$' + ${p.total}" class="text-primary fw-bold"></td>
                                    <td>
                                        <span th:if="${p.estado.name() == 'PENDIENTE_PAGO'}" class="badge bg-warning text-dark">Pendiente</span>
                                        <span th:if="${p.estado.name() == 'COMPLETADO'}" class="badge bg-success">Completado</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <a th:href="@{/admin/pedidos/detalle/{id}(id=${p.idPedido})}" class="btn btn-sm btn-outline-dark">
                                            <i class="bi bi-eye"></i> Ver
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
