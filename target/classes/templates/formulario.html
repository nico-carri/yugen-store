<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
    <title th:text="${titulo}"></title>
</head>

<body class="wrapper">
    <div th:replace="~{layout :: header}"></div>

    <main class="container content my-5" style="margin-top: 100px !important;">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm p-4 border-0">
                    <h1 class="mb-4 fw-bold text-center" th:text="${titulo}"></h1>
                    <hr class="mb-4">

                    <form th:action="@{/productos/guardar}" method="post" th:object="${producto}">
                        <input type="hidden" th:field="*{idProducto}" />

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Nombre del Producto:</label>
                            <input type="text" id="nombre" class="form-control" th:field="*{nombre}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="precio" class="form-label fw-bold">Precio:</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" id="precio" class="form-control" step="0.01"
                                        th:field="*{precio}" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="stock" class="form-label fw-bold">Stock:</label>
                                <input type="number" id="stock" class="form-control" th:field="*{stock}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="categoria" class="form-label fw-bold">Categoría:</label>
                            <input type="text" id="categoria" class="form-control" th:field="*{categoria}" required>
                        </div>

                        <div class="mb-3">
                            <label for="imagenUrl" class="form-label fw-bold">URL de Imagen:</label>
                            <input type="url" id="imagenUrl" class="form-control" th:field="*{imagenUrl}" required>
                        </div>

                        <div class="mb-4">
                            <label for="descripcion" class="form-label fw-bold">Descripción (Opcional):</label>
                            <textarea id="descripcion" class="form-control" rows="3"
                                th:field="*{descripcion}"></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4 fw-bold">Guardar Producto</button>
                            <a th:href="@{/productos}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: js-scripts}"></div>
</body>

</html>
