<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
    <title>Mis Pedidos - Yugen Store</title>
</head>

<body class="wrapper bg-light">
    <div th:replace="~{layout :: header}"></div>

    <main class="container content my-5" style="margin-top: 100px !important;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold mb-0"><i class="bi bi-clock-history me-2 text-primary"></i>Mis Compras</h1>
        </div>

        <div th:if="${pedidos == null or pedidos.isEmpty()}" class="card shadow-sm border-0 py-5 text-center">
            <div class="card-body">
                <i class="bi bi-bag-x fs-1 text-muted"></i>
                <h3 class="mt-3 fw-bold">Aún no hay compras</h3>
                <p class="text-muted">¡Es un buen momento para empezar tu colección!</p>
                <a th:href="@{/productos/catalogo}" class="btn btn-primary rounded-pill px-4 mt-2">Ir al Catálogo</a>
            </div>
        </div>

        <div th:if="${pedidos != null and !pedidos.isEmpty()}"
            class="table-responsive shadow-sm bg-white rounded-4 overflow-hidden">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-dark text-white">
                    <tr>
                        <th class="ps-4 py-3">Orden #</th>
                        <th class="py-3">Fecha y Hora</th>
                        <th class="py-3">Estado</th>
                        <th class="py-3">Total</th>
                        <th class="text-center py-3">Detalles</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${pedidos}">
                        <td class="ps-4 fw-bold" th:text="'#' + ${p.idPedido}"></td>
                        <td th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span class="badge rounded-pill px-3 py-2"
                                th:classappend="${p.estado.name() == 'COMPLETADO' ? 'bg-success' : 'bg-warning text-dark'}"
                                th:text="${p.estado}">ESTADO</span>
                        </td>
                        <td class="fw-bold text-primary" th:text="'$' + ${p.total}"></td>
                        <td class="text-center">
                            <a th:href="@{/pedidos/detalle/{idPedido}(idPedido=${p.idPedido})}"
                                class="btn btn-outline-primary btn-sm rounded-pill px-3">
                                <i class="bi bi-eye-fill"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: js-scripts}"></div>
</body>

</html>
