<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
  <title>Yugen Store - Inicio</title>
</head>

<body class="wrapper">
  <div th:replace="~{layout :: header}"></div>

  <main class="container content" style="margin-top: 100px;">

    <header class="jumbotron my-5 text-center">
      <h1 class="display-3 fw-bold">Bienvenidos a Yugen Store</h1>
      <p class="lead text-muted">Tu destino favorito para coleccionables originales</p>
    </header>

    <div id="carouselExampleIndicators" class="carousel slide shadow mb-5" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
      </div>
      <div class="carousel-inner rounded shadow-sm">
        <div class="carousel-item active">
          <img
            src="https://axmjtpthgvgy.objectstorage.sa-vinhedo-1.oci.customer-oci.com/n/axmjtpthgvgy/b/yugen-imagenes/o/assets/banner-1.jpg"
            class="d-block w-100" alt="Novedades Manga" style="max-height: 400px; object-fit: cover;">
        </div>
        <div class="carousel-item">
          <img
            src="https://axmjtpthgvgy.objectstorage.sa-vinhedo-1.oci.customer-oci.com/n/axmjtpthgvgy/b/yugen-imagenes/o/assets/banner-2.jpg"
            class="d-block w-100" alt="Nuevas Figuras" style="max-height: 400px; object-fit: cover;">
        </div>
        <div class="carousel-item">
          <img
            src="https://axmjtpthgvgy.objectstorage.sa-vinhedo-1.oci.customer-oci.com/n/axmjtpthgvgy/b/yugen-imagenes/o/assets/banner-3.jpg"
            class="d-block w-100" alt="Ofertas Especiales" style="max-height: 400px; object-fit: cover;">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
        data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
        data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
      </button>
    </div>

    <section class="container my-5">
      <h2 class="text-center mb-5 fw-bold text-uppercase">Categorías</h2>
      <div class="row g-4">
        <div class="col-lg-3 col-md-6 col-12" th:each="entry : ${mapaCategorias}">
          <a th:href="@{/productos/catalogo(categoria=${entry.key})}" class="category-card">
            <div class="category-img-container rounded shadow-sm">
              <img th:src="${entry.value}" class="category-img" th:alt="${entry.key}">
              <div class="category-overlay">
                <span class="category-name" th:text="${entry.key}">NOMBRE</span>
              </div>
            </div>
          </a>
        </div>

      </div>
    </section>

  </main>

  <div th:replace="~{layout :: footer}"></div>
  <div th:replace="~{layout :: js-scripts}"></div>
</body>

</html>
