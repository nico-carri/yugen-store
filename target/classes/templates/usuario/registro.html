<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
    <title>Yugen Store - Registro</title>
</head>

<body class="wrapper">
    <div th:replace="~{layout :: header}"></div>

    <main class="container content d-flex justify-content-center align-items-center my-5">
        <div class="card shadow border-0" style="max-width: 600px; width: 100%;">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center fw-bold mb-4">Crear Cuenta</h2>

                <div th:if="${error}" class="alert alert-danger shadow-sm" th:text="${error}"></div>
                <div th:if="${mensaje}" class="alert alert-success shadow-sm" th:text="${mensaje}"></div>

                <form th:action="@{/usuario/registro}" th:object="${usuario}" method="post">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Apellido</label>
                            <input type="text" th:field="*{apellido}" class="form-control" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Fecha de Nacimiento</label>
                            <input type="date" th:field="*{fechaNacimiento}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Género</label>
                            <select th:field="*{genero}" class="form-select" required>
                                <option value="" selected disabled>Elegir...</option>
                                <option th:each="g : ${T(ar.org.centro8curos.model.enums.Genero).values()}"
                                    th:value="${g}" th:text="${g}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Correo Electrónico</label>
                        <input type="email" th:field="*{email}" class="form-control" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Ciudad</label>
                            <input type="text" th:field="*{ciudad}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Dirección</label>
                            <input type="text" th:field="*{direccion}" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Teléfono</label>
                        <input type="tel" th:field="*{telefono}" class="form-control" required>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Contraseña</label>
                            <input type="password" th:field="*{password}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Confirmar</label>
                            <input type="password" name="confirmarPassword" class="form-control" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 fw-bold py-2 shadow-sm">
                        <i class="bi bi-person-plus me-2"></i>REGISTRARME
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <span class="text-muted small">¿Ya tienes cuenta?
                        <a th:href="@{/usuario/login}" class="text-decoration-none fw-bold text-primary">Inicia
                            sesión</a>
                    </span>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: js-scripts}"></div>
</body>

</html>
