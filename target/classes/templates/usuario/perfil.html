<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
    <title>Mi Perfil - Yugen Store</title>
</head>

<body class="wrapper">
    <div th:replace="~{layout :: header}"></div>

    <div class="container content my-5" style="margin-top: 120px !important;">
        <div class="row">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-4 text-center">
                    <div class="mb-3">
                        <img th:src="'https://ui-avatars.com/api/?name=' + ${usuario.nombre} + '+' + ${usuario.apellido} + '&background=random&size=100'"
                            class="rounded-circle shadow-sm" alt="Foto perfil">
                    </div>
                    <h4 class="fw-bold" th:text="${usuario.nombre} + ' ' + ${usuario.apellido}">Nombre de Usuario</h4>
                    <p class="text-muted" th:text="${usuario.email}">email@ejemplo.com</p>
                    <span class="badge bg-secondary mb-3" th:text="${usuario.role}">ROL</span>
                    <hr>
                    <a href="#" class="btn btn-outline-dark btn-sm rounded-pill">Editar mis datos</a>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card border-0 shadow-sm p-4">
                    <h3 class="fw-bold mb-4">Mi Actividad</h3>

                    <div th:if="${usuario.role.name() == 'CLIENTE'}">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Mis Pedidos Recientes</h5>
                            <a th:href="@{/pedidos/historial}" class="btn btn-link btn-sm text-decoration-none">Ver
                                todo</a>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover mt-3 align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-3">Orden #</th>
                                        <th>Fecha</th>
                                        <th>Estado</th>
                                        <th>Total</th>
                                        <th class="text-end pe-3">Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="p : ${pedidos}">
                                        <td th:text="'#' + ${p.idPedido}" class="fw-bold ps-3"></td>
                                        <td th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy')}"></td>
                                        <td>
                                            <span th:if="${p.estado.name() == 'COMPLETADO'}"
                                                class="badge rounded-pill bg-success">Completado</span>
                                            <span th:if="${p.estado.name() == 'PENDIENTE_PAGO'}"
                                                class="badge rounded-pill bg-warning text-dark">Pendiente</span>
                                            <span th:if="${p.estado.name() == 'CANCELADO'}"
                                                class="badge rounded-pill bg-danger">Cancelado</span>
                                        </td>
                                        <td class="fw-bold text-primary" th:text="'$' + ${p.total}"></td>
                                        <td class="text-end pe-3">
                                            <a th:href="@{/pedidos/detalle/{id}(id=${p.idPedido})}"
                                                class="btn btn-sm btn-outline-primary rounded-pill px-3">
                                                <i class="bi bi-eye-fill me-1"></i> Detalle
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div th:if="${pedidos == null or pedidos.isEmpty()}"
                            class="text-center py-5 border rounded bg-light mt-3">
                            <i class="bi bi-cart-x text-muted" style="font-size: 3rem;"></i>
                            <h5 class="text-muted">Aún no realizaste ninguna compra</h5>
                            <a th:href="@{/productos/catalogo}" class="btn btn-primary btn-sm rounded-pill px-4 mt-2">Ir
                                a la Tienda</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: js-scripts}"></div>
</body>

</html>
