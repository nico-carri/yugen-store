<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
    <title>Yugen Store - Iniciar Sesión</title>
</head>

<body class="wrapper">
    <div th:replace="~{layout :: header}"></div>

    <div class="container content d-flex justify-content-center align-items-center my-5">
        <div class="card shadow border-0" style="max-width: 400px; width: 100%;">
            <div class="card-body p-5">
                <h2 class="text-center fw-bold mb-4">Iniciar Sesión</h2>

                <form th:action="@{/usuario/login}" method="post">
                    <div th:if="${param.error}" class="alert alert-danger">
                        Email o contraseña incorrectos.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success">
                        Has cerrado sesión correctamente.
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" name="username" class="form-control" required placeholder="tu@email.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Contraseña</label>
                        <input type="password" name="password" class="form-control" required placeholder="******">
                    </div>

                    <button type="submit" class="btn btn-dark w-100 fw-bold py-2">INGRESAR</button>
                </form>
                <p class="text-center mt-3">¿No tienes cuenta? <a th:href="@{/usuario/registro}"
                        class="fw-bold">Regístrate aquí</a></p>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: js-scripts}"></div>
</body>

</html>
